name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    # Both browser modes run real-time physics, including four-duck music.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pre-development baseline
        run: |
          git merge-base --is-ancestor v0 HEAD
          test "$(git ls-tree -r --name-only v0 | wc -l)" -eq 0
          test -f CONTRIBUTING.md
          test -f THIRD_PARTY.md
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --extra simulation
      - run: uv run --frozen --no-sync python scripts/fetch_scene_assets.py
      - run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: uv run ruff check src tests scripts/build_release.py scripts/release_smoke.py
      - run: bash -n scripts/install_release.sh
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=json --cov-report=html --cov-report=xml
      - run: uv run python scripts/check_coverage.py
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npm run test:unit
        working-directory: frontend
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run test:e2e:dev
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-browser-results
          path: |
            htmlcov/
            coverage.xml
            coverage.json
            frontend/playwright-report/
            frontend/test-results/
