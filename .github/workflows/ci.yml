name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify pre-development baseline
        run: |
          git merge-base --is-ancestor v0 HEAD
          test "$(git ls-tree -r --name-only v0 | wc -l)" -eq 0
          test -f CONTRIBUTING.md
          test -f THIRD_PARTY.md
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            external/microduck_rl
            external/policies
            external/sources.json
          key: ${{ runner.os }}-scene-${{ hashFiles('scripts/fetch_scene_assets.py') }}
      - uses: actions/cache@v4
        with:
          path: external/asr
          key: ${{ runner.os }}-asr-${{ hashFiles('scripts/fetch_asr_assets.py') }}
      - run: uv sync --frozen --extra simulation --extra local-asr
      # Fetchers validate pinned revisions / hashes even when restored from cache.
      - run: uv run --frozen --no-sync python scripts/fetch_scene_assets.py
      - run: uv run --frozen --no-sync python scripts/fetch_asr_assets.py
      - run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: uv run ruff check src tests scripts/build_release.py scripts/release_smoke.py scripts/fetch_asr_assets.py scripts/export_coverage.py
      - run: bash -n scripts/install_release.sh
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=json --cov-report=html --cov-report=xml
      - run: uv run python scripts/check_coverage.py
      - name: Export commit-bound backend coverage
        run: >-
          uv run python scripts/export_coverage.py
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            htmlcov/
            coverage.xml
            coverage.json
            coverage-summary.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run test:unit
        working-directory: frontend
      - name: Verify both browser groups cover every test exactly once
        run: node scripts/verify-ci-groups.mjs
        working-directory: frontend

  browser:
    name: browser-${{ matrix.mode }}-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [production, development]
        group: [journey, checks]
    env:
      DUCKKING_TEST_DEV: ${{ matrix.mode == 'development' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            external/microduck_rl
            external/policies
            external/sources.json
          key: ${{ runner.os }}-scene-${{ hashFiles('scripts/fetch_scene_assets.py') }}
      - run: uv sync --frozen --extra simulation
      - run: uv run --frozen --no-sync python scripts/fetch_scene_assets.py
      - run: sudo apt-get update && sudo apt-get install -y libopus0
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            npx playwright install --with-deps chromium
          fi
        working-directory: frontend
      # Each group has its own runner, server, rooms and single browser worker.
      # The complete journey and every remaining test run in BOTH build modes.
      - name: Browser checks
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          if [ "$TEST_GROUP" = journey ]; then
            npx playwright test --grep @journey
          else
            npx playwright test --grep-invert @journey
          fi
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.mode }}-${{ matrix.group }}
          path: |
            frontend/playwright-report/
            frontend/test-results/

  # Preserve the existing required check name and fail on any incomplete group.
  quality:
    if: always()
    needs: [backend, frontend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BROWSER_RESULT" = success
